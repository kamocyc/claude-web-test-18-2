<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>地形改変プロトタイプ</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #0b0d10; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', sans-serif;
        color: #e8eaed;
      }
      #app { position: fixed; inset: 0; }
      canvas { display: block; width: 100%; height: 100%; touch-action: none; }

      .panel {
        position: fixed;
        background: rgba(16, 19, 24, 0.82);
        border: 1px solid rgba(255, 255, 255, 0.09);
        border-radius: 8px;
        backdrop-filter: blur(8px);
        font-size: 12px;
        line-height: 1.5;
        user-select: none;
      }

      #hud { top: 12px; left: 12px; padding: 10px 14px; min-width: 190px; }
      #hud .row { display: flex; justify-content: space-between; gap: 16px; }
      #hud .k { color: #93a0b4; }
      #hud .v { font-variant-numeric: tabular-nums; }
      #hud hr { border: 0; border-top: 1px solid rgba(255,255,255,.08); margin: 6px 0; }

      #perf { bottom: 12px; left: 12px; padding: 8px 12px; font-variant-numeric: tabular-nums; color: #93a0b4; }

      #help { bottom: 12px; right: 12px; padding: 10px 14px; max-width: 260px; color: #93a0b4; }
      #help b { color: #e8eaed; font-weight: 600; }

      .swatch { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; vertical-align: baseline; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud" class="panel"></div>
    <div id="perf" class="panel"></div>
    <div id="help" class="panel">
      <b>左ドラッグ</b> 回転 / <b>右ドラッグ</b> 平行移動 / <b>ホイール</b> ズーム
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
